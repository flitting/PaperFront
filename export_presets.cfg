[preset.0]
name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="development"
export_filter="all_resources"
include_filter="data/*.json,scripts/faction_trait_text.json,assets/cards/contours.json,assets/audio/voices/*.json,assets/audio/music/*.json,assets/audio/radio/*.json,assets/audio/README_demo_original.md,assets/audio/licenses/*.txt,assets/fonts/LICENSE.txt,assets/LICENSE.md,assets/creator_hand/*.json,assets/creator_hand/MAKEHUMAN_LICENSE.md"
exclude_filter="docs/*,tests/*,tools/*,artifacts/*,assets/map_design_v6/*,assets/audio/voices/*.wav,assets/audio/voices/*.mp3,assets/audio/voices/*.ogg"
export_path="artifacts/linux/PaperFront.x86_64"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

